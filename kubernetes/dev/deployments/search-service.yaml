apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  labels:
    app: search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
      - name: search-service
        image: proyecto-final-grupo-11-backend-search-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: shared-infra-config
              key: redis-url
        - name: SQS_QUEUE_URL
          valueFrom:
            configMapKeyRef:
              name: shared-infra-config
              key: sqs-queue-url
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: shared-infra-config
              key: aws-region
        - name: AWS_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: shared-infra-config
              key: aws-endpoint-url
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  selector:
    app: search-service
  ports:
  - port: 80
    targetPort: 8000
